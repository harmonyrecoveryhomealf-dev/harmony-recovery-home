<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment confirmed — Harmony Recovery Home</title>
<style>
body{font:16px/1.6 Inter,system-ui,sans-serif;background:#f5f1e7;color:#2a3020;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:#fffdf8;border:1px solid #e0d9c4;border-radius:22px;padding:40px 32px;max-width:460px;text-align:center}
.ok{width:52px;height:52px;border-radius:50%;background:#56652f;color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:1.6rem}
h1{font-family:Georgia,serif;color:#56652f;margin:0 0 10px}
p{margin:0 0 8px;color:#3d3d30}
.muted{color:#6a6a55;font-size:.9rem;margin-top:18px}
a{color:#56652f}
</style>
</head>
<body>
<div class="card">
<div class="ok">✓</div>
<h1>Thank you!</h1>
<p id="msg">Confirming your payment…</p>
<p class="muted"><a href="/">Back to Harmony Recovery Home</a></p>
</div>
<script>
const id=new URLSearchParams(location.search).get("session_id");
const msg=document.getElementById("msg");
if(id){
  fetch("/api/session-status?session_id="+encodeURIComponent(id))
    .then(r=>r.json())
    .then(d=>{
      if(d.status==="paid"){
        const amt=typeof d.amount_total==="number"?(d.amount_total/100).toLocaleString(undefined,{style:"currency",currency:(d.currency||"usd").toUpperCase()}):"";
        msg.textContent="Your reservation deposit"+(amt?(" of "+amt):"")+" has been received."+(d.email?(" A confirmation has been sent to "+d.email+"."):"");
      } else {
        msg.textContent="We could not confirm your payment yet. If you were charged, please contact us and we will verify it.";
      }
    })
    .catch(()=>{ msg.textContent="Payment received. If you have any questions, please contact us."; });
} else {
  msg.textContent="Payment received.";
}
</script>
</body>
</html>
